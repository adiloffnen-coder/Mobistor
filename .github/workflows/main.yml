name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate Android project
        id: proj
        run: |
          if [ -f "app/build.gradle.kts" ] || [ -f "app/build.gradle" ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          elif 
          from pathlib import Path
          p = Path("app/build.gradle.kts")
          if not p.exists():
              p = Path("app/build.gradle")
          s = p.read_text()
          if "jvmToolchain(17)" not in s:
              s += "\nkotlin { jvmToolchain(17) }\n"
              p.write_text(s)
          print("OK", p)
          PY

      - name: Build debug APK
        working-directory: ${{ steps.proj.outputs.dir }}
        run: gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MobiStock-APK
          path: |
            ${{ steps.proj.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
