name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate Android project
        id: proj
        run: |
          if [ -f "app/build.gradle.kts" ] || [ -f "app/build.gradle" ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          elif [ -f "MobiStock_V1/app/build.gradle.kts" ] || [ -f "MobiStock_V1/app/build.gradle" ]; then
            echo "dir=MobiStock_V1" >> "$GITHUB_OUTPUT"
          else
            echo "Projet Android introuvable"
            find . -name "build.gradle*" | head -20
            exit 1
          fi
          echo "Project dir: ${{ steps.proj.outputs.dir }}"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Force Java 17 toolchain
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/build.gradle.kts")
          if not p.exists():
              p = Path("app/build.gradle")
          s = p.read_text()
          if "jvmToolchain(17)" not in s:
              s += "\nkotlin { jvmToolchain(17) }\n"
              p.write_text(s)
          print("OK", p)
          PY

      - name: Build debug APK
        working-directory: ${{ steps.proj.outputs.dir }}
        run: gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MobiStock-APK
          path: |
            ${{ steps.proj.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
