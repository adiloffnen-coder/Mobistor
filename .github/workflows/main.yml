name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Télécharger le projet
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Décompresser le projet
        run: unzip -o JorfFertilizersApp_v1.zip

      - name: Créer la configuration Java 17
        run: |
          cat > java17.init.gradle <<'EOF'
          allprojects {
              tasks.withType(JavaCompile).configureEach {
                  sourceCompatibility = "17"
                  targetCompatibility = "17"
              }
          }
          EOF

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Construire l'APK
        run: gradle --init-script java17.init.gradle :app:assembleDebug

      - name: Récupérer l'APK
        uses: actions/upload-artifact@v4
        with:
          name: MobiStor-APK
          path: app/build/outputs/apk/debug/app-debug.apk
